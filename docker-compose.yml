# Local databases for development only.
services:
  postgres:
    image: pgvector/pgvector:pg16   # plain Postgres + pgvector (optional bonus)
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supplychain
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/changeme-neo4j
    ports: ["7474:7474", "7687:7687"]
    volumes: [neodata:/data]
volumes:
  pgdata:
  neodata:
